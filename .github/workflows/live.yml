name: live numbers

# Rebuilds everything that carries live state:
#   assets/figure-*.svg  the product's public stats endpoint
#   README.md            the same stats, plus the public contribution feed
#
# Daily, plus a manual run from the Actions tab. No secrets and no third-party
# actions: every source is public, so nothing here needs a token beyond the
# checkout.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-numbers
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each source fails closed: one that is down or has changed shape writes
      # nothing, so the commit step below keeps the last good numbers and the
      # job still reports the failure.
      - name: Rebuild
        id: rebuild
        continue-on-error: true
        run: python tools/build.py --user "${{ github.repository_owner }}"

      - name: Commit if a number moved
        run: |
          if [ -z "$(git status --porcelain assets README.md)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -m "chore: refresh live numbers"
          git push

      - name: Surface a failed source
        if: steps.rebuild.outcome == 'failure'
        run: |
          echo "::error::a source failed; the previous numbers are still committed"
          exit 1
